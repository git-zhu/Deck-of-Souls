<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1512"/>
      <stop offset="45%" stop-color="#241d16"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#e8c66a" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8a6a2f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5f4d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3a3328" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky gradient -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Golden glow center -->
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Distant castle silhouette -->
  <g fill="#0e0b09" opacity="0.9">
    <rect x="860" y="300" width="260" height="260"/>
    <rect x="900" y="240" width="60" height="80"/>
    <rect x="1020" y="260" width="50" height="70"/>
    <rect x="880" y="330" width="20" height="40"/>
    <rect x="1000" y="320" width="18" height="45"/>
    <rect x="920" y="560" width="180" height="20"/>
  </g>

  <!-- Rune circle (Elden Ring style golden ring) -->
  <g transform="translate(640, 300)" opacity="0.5">
    <circle r="70" fill="none" stroke="#e8c66a" stroke-width="2.5" opacity="0.55"/>
    <circle r="82" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.35"/>
    <circle r="58" fill="none" stroke="#e8c66a" stroke-width="1" stroke-dasharray="10 8" opacity="0.4"/>
    <!-- Inner runes -->
    <g stroke="#e8c66a" stroke-width="1.6" fill="none" opacity="0.6">
      <path d="M-20,-40 L0,-55 L20,-40"/>
      <path d="M40,-20 L55,0 L40,20"/>
      <path d="M20,40 L0,55 L-20,40"/>
      <path d="M-40,20 L-55,0 L-40,-20"/>
      <path d="M0,-20 L14,10 L-14,10 Z"/>
    </g>
  </g>

  <!-- Mist layers -->
  <g filter="url(#blur)">
    <ellipse cx="200" cy="640" rx="520" ry="90" fill="url(#mist)"/>
    <ellipse cx="1050" cy="680" rx="580" ry="100" fill="url(#mist)"/>
    <ellipse cx="640" cy="720" rx="700" ry="120" fill="#241d16" opacity="0.85"/>
  </g>

  <!-- Bottom dark ground -->
  <rect y="620" width="1280" height="100" fill="#0a0806" opacity="0.9"/>

  <!-- Subtle particles (gold dust) -->
  <g fill="#e8c66a" opacity="0.3">
    <circle cx="380" cy="180" r="1.2"/>
    <circle cx="540" cy="130" r="1"/>
    <circle cx="700" cy="200" r="1.4"/>
    <circle cx="880" cy="150" r="1"/>
    <circle cx="260" cy="260" r="0.9"/>
    <circle cx="1010" cy="220" r="1.1"/>
    <circle cx="640" cy="470" r="1.3"/>
    <circle cx="440" cy="400" r="0.8"/>
    <circle cx="830" cy="380" r="1"/>
  </g>
</svg>
